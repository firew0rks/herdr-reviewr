name: release

# The fork's releases: a `fork-v<manifest version>` tag builds the two binaries herdr/install.sh
# downloads, each with a .sha256 sidecar, and publishes them as one release.
on:
  push:
    tags: ["fork-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, asset: herdr-reviewr-macos-aarch64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: herdr-reviewr-linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/herdr-reviewr ${{ matrix.asset }}
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The manifest version picks the release install.sh downloads, so a mismatched tag installs nothing.
      - name: Tag matches herdr-plugin.toml
        run: |
          v=$(grep -m1 '^version' herdr-plugin.toml | sed -E 's/.*"([^"]+)".*/\1/')
          [ "fork-v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest fork-v$v"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
